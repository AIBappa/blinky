# 1. BLUETOOTH CONFIGURATION
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ADC_ADS1115"

# 2. I2C CONFIGURATION
CONFIG_I2C=y

# 3. FLOATING POINT & MATH SUPPORT
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# 4. SYSTEM LOGGING & DEBUGGING
CONFIG_LOG=y

# XIAO BLE USB Console Configuration
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y                  # keep - used in main.c for DTR detection
CONFIG_USB_DEVICE_STACK_NEXT=y           # replaces USB_DEVICE_STACK
CONFIG_USBD_CDC_ACM_CLASS=y              # replaces USB_CDC_ACM (implicit in old stack)

# 5. MEMORY MANAGEMENT
CONFIG_HEAP_MEM_POOL_SIZE=2048