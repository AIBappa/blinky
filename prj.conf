# Enable SPI peripheral drivers
CONFIG_SPI=y

# Enable Floating Point Unit (FPU) for 24-bit voltage calculations
CONFIG_FPU=y

# Enable standard C libraries for float formatting in printk
CONFIG_NEWLIB_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Increase stack size for sensor processing and math
CONFIG_MAIN_STACK_SIZE=2048

# Enable GPIO for Chip Select and Data Ready handling
CONFIG_GPIO=y