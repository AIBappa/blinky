# 1. BLUETOOTH CONFIGURATION
# Enables the Bluetooth stack and allows the Xiao to act as a Peripheral (Slave)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ADC_ADS1115"

# 2. I2C CONFIGURATION
# Enables the I2C driver required to talk to the ADS1115
CONFIG_I2C=y

# 3. ADC CONFIGURATION
# Enable the Zephyr ADC subsystem (specific drivers are auto-enabled by app.overlay)
CONFIG_ADC=y

# 4. FLOATING POINT & MATH SUPPORT
# Crucial for calculating Dosha patterns and signal processing
CONFIG_FPU=y
# Enables floating-point support for printk/printf (so you can see decimal values in logs)
CONFIG_CBPRINTF_FP_SUPPORT=y

# 4. SYSTEM LOGGING & DEBUGGING
# Enables the standard Zephyr logger and UART console for USB debugging
CONFIG_LOG=y

# XIAO BLE USB Console Configuration
# We MUST force the console subsystem to use the USB CDC ACM connection
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# 5. MEMORY MANAGEMENT
# Ensures the Bluetooth stack has enough heap space for your custom services
CONFIG_HEAP_MEM_POOL_SIZE=2048